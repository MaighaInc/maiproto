version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receiptflow
      POSTGRES_PASSWORD: receiptflow
      POSTGRES_DB: receiptflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U receiptflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://receiptflow:receiptflow@postgres:5432/receiptflow
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://receiptflow:receiptflow@postgres:5432/receiptflow
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://api:3000
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NEXTAUTH_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://api:3000
    ports:
      - '3001:3001'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
